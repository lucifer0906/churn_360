services:
  api:
    build:
      context: .
    image: churn360-api:stage4
    container_name: churn360-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
